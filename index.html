<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>tuis webhook spammer</title>

    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 30px;
            max-width: 700px;
            margin: auto;
        }

        h1 {
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #0f0;
            color: #000;
        }

        #log {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #0f0;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h1>tuis webhook spammer</h1>

<label for="webhook">webhook url:</label>
<input
    id="webhook"
    type="text"
    placeholder="paste your webhook url here"
>

<label for="message">message:</label>
<input
    id="message"
    type="text"
    placeholder="type what you want the webhook to say"
>

<button onclick="sendMessages()">send 10 messages</button>

<div id="log">ready.</div>

<script>
async function sendMessages() {
    const webhook = document.getElementById("webhook").value.trim();
    const message = document.getElementById("message").value;
    const log = document.getElementById("log");

    if (!webhook) {
        log.textContent = "error: enter a webhook url.";
        return;
    }

    if (!message.trim()) {
        log.textContent = "error: type a message.";
        return;
    }

    log.textContent = "starting...\n";

    for (let i = 0; i < 10; i++) {
        try {
            const response = await fetch(webhook, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    content: message
                })
            });

            if (response.ok) {
                log.textContent += "message sent\n";
            } else {
                log.textContent += "failed: HTTP " + response.status + "\n";
            }
        } catch (error) {
            log.textContent += "error: " + error.message + "\n";
        }

        await new Promise(resolve => setTimeout(resolve, 1000));
    }

    log.textContent += "\nfinished.";
}
</script>

</body>
</html>
