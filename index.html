<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tuis Webhook Tester</title>

    <style>
        body {
            background: #e5e5e5;
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        .box {
            width: 500px;
            margin: auto;
            background: #ffffff;
            border: 1px solid #bdbdbd;
            padding: 20px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 20px 0;
            color: #222;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #444;
        }

        input,
        textarea {
            width: 100%;
            background: #f5f5f5;
            color: #222;
            border: 1px solid #aaa;
            padding: 9px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #666;
            background: #fff;
        }

        button {
            margin-top: 16px;
            padding: 9px 15px;
            background: #d6d6d6;
            color: #222;
            border: 1px solid #999;
            cursor: pointer;
        }

        button:hover {
            background: #c5c5c5;
        }

        #status {
            margin-top: 15px;
            padding: 8px;
            background: #f0f0f0;
            border: 1px solid #c4c4c4;
            font-size: 13px;
        }

        .small {
            color: #777;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Tuis Webhook Tester</h1>

    <label>Webhook URL</label>
    <input id="webhook" type="text" placeholder="Paste webhook URL here">

    <label>Message</label>
    <textarea id="message" placeholder="Type a test message"></textarea>

    <button onclick="sendMessage()">Send Test Message</button>

    <div id="status">Status: Ready</div>

    <div class="small">
        Sends one test message to the webhook.
    </div>

</div>

<script>
function sendMessage() {
    var webhook = document.getElementById("webhook").value.trim();
    var message = document.getElementById("message").value;
    var status = document.getElementById("status");

    if (webhook == "") {
        status.innerText = "Status: Enter a webhook URL.";
        return;
    }

    if (message == "") {
        status.innerText = "Status: Enter a message.";
        return;
    }

    status.innerText = "Status: Sending...";

    fetch(webhook, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            content: message
        })
    })
    .then(function(response) {
        if (response.ok) {
            status.innerText = "Status: Message sent.";
        } else {
            status.innerText = "Status: Failed (HTTP " + response.status + ")";
        }
    })
    .catch(function(error) {
        status.innerText = "Status: Request failed.";
    });
}
</script>

</body>
</html>
