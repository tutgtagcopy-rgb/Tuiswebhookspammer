<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tuis Webhook Tester</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #eeeeee;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }

        .top {
            background: #d2d2d2;
            border-bottom: 1px solid #999;
            padding: 12px 18px;
        }

        .top b {
            font-size: 18px;
        }

        .main {
            width: 700px;
            margin: 25px auto;
            background: white;
            border: 1px solid #aaa;
        }

        .title {
            background: #e0e0e0;
            border-bottom: 1px solid #aaa;
            padding: 9px 12px;
            font-weight: bold;
        }

        .content {
            padding: 15px;
        }

        .row {
            margin-bottom: 14px;
        }

        .row label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 7px;
            border: 1px solid #999;
            background: #fff;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: 1px solid #666;
        }

        .buttons {
            border-top: 1px solid #ccc;
            padding-top: 12px;
        }

        button {
            padding: 6px 14px;
            background: #d9d9d9;
            border: 1px solid #888;
            color: #222;
            font-size: 13px;
            cursor: pointer;
        }

        button:hover {
            background: #c9c9c9;
        }

        #status {
            margin-top: 14px;
            padding: 8px;
            background: #f2f2f2;
            border: 1px solid #bbb;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 11px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="top">
    <b>Tuis Webhook Tester</b>
</div>

<div class="main">

    <div class="title">
        Webhook Test
    </div>

    <div class="content">

        <div class="row">
            <label>Webhook URL:</label>
            <input
                id="webhook"
                type="text"
                placeholder="Enter webhook URL"
            >
        </div>

        <div class="row">
            <label>Message:</label>
            <textarea
                id="message"
                placeholder="Enter message"
            ></textarea>
        </div>

        <div class="buttons">
            <button onclick="sendMessage()">
                Send Test
            </button>

            <button onclick="clearFields()">
                Clear
            </button>
        </div>

        <div id="status">
            Status: Ready
        </div>

    </div>
</div>

<div class="footer">
    Tuis Webhook Tester
</div>

<script>
function sendMessage() {
    var webhook = document.getElementById("webhook").value.trim();
    var message = document.getElementById("message").value;
    var status = document.getElementById("status");

    if (webhook === "") {
        status.innerText = "Status: Webhook URL is empty.";
        return;
    }

    if (message === "") {
        status.innerText = "Status: Message is empty.";
        return;
    }

    status.innerText = "Status: Sending...";

    fetch(webhook, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            content: message
        })
    })
    .then(function(response) {
        if (response.ok) {
            status.innerText = "Status: Test message sent.";
        } else {
            status.innerText =
                "Status: Failed - HTTP " + response.status;
        }
    })
    .catch(function() {
        status.innerText = "Status: Request failed.";
    });
}

function clearFields() {
    document.getElementById("webhook").value = "";
    document.getElementById("message").value = "";
    document.getElementById("status").innerText = "Status: Ready";
}
</script>

</body>
</html>
