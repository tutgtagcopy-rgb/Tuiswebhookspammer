<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>tuis webhook spammer</title>
    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 30px;
        }

        input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            padding: 10px;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #0f0;
            color: #000;
        }

        #log {
            margin-top: 20px;
            border: 1px solid #0f0;
            padding: 10px;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<h2>WEBHOOK TESTER</h2>

<input id="webhook" type="text" placeholder="Paste your webhook URL">

<textarea id="message" placeholder="Test message">Webhook test message</textarea>

<button onclick="sendMessages()">SEND 10 TEST MESSAGES</button>

<div id="log">Ready.</div>

<script>
async function sendMessages() {
    const webhook = document.getElementById("webhook").value.trim();
    const message = document.getElementById("message").value;
    const log = document.getElementById("log");

    if (!webhook) {
        log.textContent = "ERROR: Enter a webhook URL.";
        return;
    }

    log.textContent = "Starting test...\n";

    for (let i = 1; i <= 10; i++) {
        try {
            const response = await fetch(webhook, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    content: message + " [" + i + "/10]"
                })
            });

            if (response.ok) {
                log.textContent += "Sent message " + i + "/10\n";
            } else {
                log.textContent += "Message " + i + " failed: HTTP " + response.status + "\n";
            }
        } catch (error) {
            log.textContent += "Message " + i + " failed: " + error.message + "\n";
        }

        await new Promise(resolve => setTimeout(resolve, 1000));
    }

    log.textContent += "\nFinished.";
}
</script>

</body>
</html>
