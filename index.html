<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>tuis webhook spammer</title>

    <style>
        body {
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 30px;
        }

        h2 {
            font-size: 24px;
        }

        input,
        textarea,
        button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            padding: 10px;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #0f0;
            color: #000;
        }

        #log {
            margin-top: 20px;
            border: 1px solid #0f0;
            padding: 10px;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>tuis webhook spammer</h2>

<input
    id="webhook"
    type="text"
    placeholder="paste your webhook url"
>

<textarea
    id="message"
    placeholder="type the message you want to send"
></textarea>

<button onclick="sendMessages()">
    send 10 messages
</button>

<div id="log">ready.</div>

<script>
async function sendMessages() {
    const webhook = document.getElementById("webhook").value.trim();
    const message = document.getElementById("message").value;
    const log = document.getElementById("log");

    if (!webhook) {
        log.textContent = "error: enter a webhook url.";
        return;
    }

    if (!message.trim()) {
        log.textContent = "error: enter a message.";
        return;
    }

    log.textContent = "starting...\n";

    for (let i = 0; i < 10; i++) {
        try {
            const response = await fetch(webhook, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: "tuis webhook spammer",
                    content: message
                })
            });

            if (response.ok) {
                log.textContent += "message sent\n";
            } else {
                log.textContent +=
                    "message failed: http " +
                    response.status +
                    "\n";
            }
        } catch (error) {
            log.textContent +=
                "message failed: " +
                error.message +
                "\n";
        }

        await new Promise(resolve => setTimeout(resolve, 1000));
    }

    log.textContent += "\nfinished.";
}
</script>

</body>
</html>
